services:
  postgres:
    image: postgres:18
    container_name: trail-metrics-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      -"5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: